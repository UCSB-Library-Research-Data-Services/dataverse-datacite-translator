[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataverse-datacite-translator"
version = "0.1.0"
description = "Translates Dataverse dataset metadata JSON into DataCite kernel-4 XML"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
dependencies = []

[tool.setuptools.packages.find]
include = ["datacite*"]

[tool.setuptools.package-data]
datacite = ["licenses/*.json"]
